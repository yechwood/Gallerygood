name: Build APK
# Rebuild after gallery background API fix

on:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build standard release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gallerygood-beta-apk
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
