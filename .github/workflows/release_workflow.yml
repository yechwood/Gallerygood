name: CI/CD Pipeline
on:
  push:
    branches: # Change this to master once everything is setup.
      - 'beta'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      max_commits:
        description: "Release notes up to:"
        required: false
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # full git history

      # Generate release notes from commit messages, restricted by 3
      - name: Generate Release Notes
        id: notes
        run: |
          # Make sure we have enough commits fetched
          git fetch --prune --unshallow 2>/dev/null || git fetch --prune
          # Use MAX_COMMITS from workflow input, default to 1
          MAX_COMMITS="${{ github.event.inputs.max_commits || 1 }}"
          echo "Using MAX_COMMITS=$MAX_COMMITS"
          # Build the notes header first
          notes="## What's new
          "
          
          # Take the last MAX_COMMITS from the current branch only, no merges
          commit_notes=$(git log HEAD --no-merges --first-parent -n $MAX_COMMITS \
            --pretty=format:"- %s (%h)")
          
          
          # Combine
          notes="$notes$commit_notes"
          
          # If there are no commits, provide a fallback message
          if [ -z "$notes" ]; then
            notes="No new commits found."
          fi
          # Output to GitHub Actions
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Cache Gradle
      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Configure Environment Variables
        run: |
          echo "DATE_TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "PLAY_CONSOLE_APP_RSA_KEY=$(echo ${{ secrets.PLAY_CONSOLE_APP_RSA_KEY }})" >> $GITHUB_ENV
          echo "ADS_APP_ID=$(echo ${{ secrets.ADS_APP_ID }})" >> $GITHUB_ENV
          echo "GIT_TAG=$(grep -E "versionName\s*=?\s*['\"]" "app/build.gradle.kts" | awk -F"['\"]" '{print $2}')" >> $GITHUB_ENV

      - name:  Validate Environment Variables
        run: |
          echo $ADS_APP_ID | sed 's/./&‌/g'
          echo $PLAY_CONSOLE_APP_RSA_KEY | sed 's/./&‌/g'
          echo $GIT_TAG | sed 's/./&‌/g'

      - name: Set Up Java and Gradle
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Build App
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease \
            --parallel \
            --configure-on-demand \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"

      - name: Sign Standard APK for local distribution
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/standard/release/app-standard-release.apk"
          OUT="app/build/outputs/apk/standard/release/Gallerygood-standard-release-signed.apk"
          KEYSTORE="$RUNNER_TEMP/gallerygood-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Gallerygood, OU=Android, O=Gallerygood, L=Unknown, ST=Unknown, C=US"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT" \
            "$APK"
          "$APKSIGNER" verify --verbose "$OUT"
          echo "Signed APK: $OUT"
          sha256sum "$OUT"

      - name: Upload Standard APK
        uses: actions/upload-artifact@v4
        with:
          name: Gallerygood-standard-release-apk
          path: app/build/outputs/apk/standard/release/Gallerygood-standard-release-signed.apk
          if-no-files-found: error
          retention-days: 7
